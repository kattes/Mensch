name: mensch_flutter
description: "Mensch ärgere Dich nicht – TV-Version (Fire TV & Google TV)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Quaternion + Vector3 (für den Canvas-3D-Würfel in dice_canvas.dart).
  # 3D-Rendering läuft über Skia/CustomPainter, KEIN GPU-Plugin: flame_3d
  # (Flutter GPU/Impeller) scheidet auf dem Fire TV Stick aus (Vulkan 1.0),
  # flutter_angle ist auf 32-bit-TVs defekt – Skia rendert auf beiden TVs.
  vector_math: ^2.2.0
  # Audio-Engine: SoLoud hält EINEN dauerhaft offenen Low-Latency-Stream und
  # mischt alle SFX in Software. Ersetzt die frühere SoundPool-Brücke, der die
  # Mi-Box (Android TV) den schnellen Mixer-Pfad verweigerte (FAST denied →
  # hohe Latenz, kurze Ticks gingen unter). Die SFX werden weiterhin in Dart
  # als PCM synthetisiert (lib/audio.dart) und einmalig in die Engine geladen.
  flutter_soloud: ^4.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
