<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensch ärgere Dich nicht</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Der Holztisch ist der Body-Hintergrund; das Brett liegt mit 20px Einzug
     links (Querformat) bzw. oben (Hochformat). Die restliche Holzfläche ist
     die Würfelzone. -->
<canvas id="board"></canvas>

<!-- 3D-Würfel, rollt nur auf der Holzfläche.
     Gezeichnet wird er per WebGL (#gl, three.js); der CSS-Cube in
     #dice3d dient nur noch als Fallback ohne WebGL. #dice3d bleibt
     immer das (unsichtbare) Eingabe-Element für Stups und Wurf.
     Glow (wer ist dran) und Bodenschatten liegen als eigene Ebenen
     unter dem Würfel auf dem Tisch. -->
<div id="diceGlow" class="hidden"></div>
<div id="diceShadow" class="hidden"></div>
<canvas id="gl"></canvas>
<div id="dice3d" class="hidden"><div class="cube" id="cube"></div></div>

<!-- Hamburger-Menü -->
<button id="menuBtn" aria-label="Menü">
  <span></span><span></span><span></span>
</button>

<div id="menu" class="hidden">
  <button id="mNew" class="btn">🔄 Neues Spiel</button>
  <button id="mLog" class="btn">📜 Protokoll anzeigen</button>
  <div id="log"></div>
  <button id="mSound" class="btn">🔊 Sound: an</button>
</div>

<!-- Spielaufbau: Anleitung + Start-Button leuchten direkt auf dem Holz
     (in der Würfelzone). Farben und Spielertyp werden direkt an den
     Pools auf dem Brett gewählt. -->
<div id="setupZone">
  <h2 class="glowtext">Mensch ärgere<br>Dich nicht</h2>
  <div class="glowtext" id="setupInfo">
    Figur antippen –<br>Farbe wählen<br><br>
    Pool antippen –<br>Mensch · Computer · Nicht dabei
  </div>
  <button id="btnStart" class="btn primary big">Spiel starten</button>
  <div class="glowtext warn" id="setupHint">&nbsp;</div>
</div>

<!-- Farbauswahl-Popup, erscheint neben dem angeklickten Pool -->
<div id="palettePop" class="hidden"></div>

<!-- Spielende -->
<div id="gameover" class="overlay hidden">
  <div class="dialog">
    <h2>Spiel beendet!</h2>
    <div id="ranking"></div>
    <button id="btnAgain" class="btn primary">Nochmal spielen</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
