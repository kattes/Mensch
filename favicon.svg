<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Farben und Lichtverlauf wie in drawPiece() im Spiel: weißer Lichtpunkt
       oben links, Übergang zu Rot, dunklerer Rand. Hintergrund ist die
       Brettfarbe (Cornsilk). -->
  <defs>
    <radialGradient id="p" cx="50%" cy="50%" r="57%" fx="35%" fy="35%">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#d62828"/>
      <stop offset="1"    stop-color="#801818"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="5" fill="#fff8dc"/>
  <circle cx="17.2" cy="17.8" r="10" fill="rgba(0,0,0,0.22)"/>
  <circle cx="16" cy="16" r="10" fill="url(#p)" stroke="#801818" stroke-width="1.3"/>
</svg>
